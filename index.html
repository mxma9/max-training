<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Test Intervals</title>
<style>
:root{--bg:#0a0a0a;--fg:#f2f2f2;--mute:#9a9a9a;--lime:#c6f432;--card:#161616;--line:#2a2a2a;--ok:#7ddf64;--bad:#ff6b5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;margin:8px 0 4px}
p{color:var(--mute);margin:6px 0 14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--lime);color:#0a0a0a;font-weight:700;font-size:16px}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;margin-top:14px;min-height:60px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Test Intervals</h1>
<p>Vérifie que cette page peut lire (et écrire) dans Intervals.icu depuis ton navigateur. La clé n'est ni enregistrée ni envoyée ailleurs que vers intervals.icu.</p>
<label for="k">Clé API Intervals (Réglages, Developer Settings)</label>
<input id="k" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="coller la clé ici">
<button id="r">Test 1 · Lecture (sommeil, FC repos)</button>
<button id="w" class="sec">Test 2 · Écriture (crée puis supprime une note)</button>
<pre id="o">En attente.</pre>
</main>
<script>
const $=s=>document.querySelector(s);
const out=(t,c)=>{$("#o").innerHTML=(c?'<span class="'+c+'">':'')+t.replace(/&/g,"&amp;").replace(/</g,"&lt;")+(c?"</span>":"")};
const H=()=>({"Authorization":"Basic "+btoa("API_KEY:"+$("#k").value.trim()),"Content-Type":"application/json"});
const B="https://intervals.icu/api/v1/athlete/0";
const day=n=>{const d=new Date(Date.now()+n*864e5);return d.toISOString().slice(0,10)};
async function call(url,opt){const r=await fetch(url,opt);const t=await r.text();return {s:r.status,t}}
$("#r").onclick=async()=>{
  if(!$("#k").value.trim())return out("Colle d'abord la clé.","bad");
  out("Lecture en cours…");
  try{
    const r=await call(B+"/wellness?oldest="+day(-3)+"&newest="+day(0),{headers:H()});
    if(r.s!==200)return out("HTTP "+r.s+"\n"+r.t.slice(0,300),"bad");
    const j=JSON.parse(r.t);
    out("LECTURE OK : "+j.length+" jours reçus.\n"+j.map(w=>w.id+" · FC repos "+(w.restingHR??"–")+" · VFC "+(w.hrv??"–")+" · sommeil "+(w.sleepSecs?(w.sleepSecs/3600).toFixed(1)+" h":"–")).join("\n"),"ok");
  }catch(e){out("ÉCHEC : "+e.message+"\nSi c'est « Load failed » ou « Failed to fetch », le navigateur bloque l'appel (CORS).","bad")}
};
$("#w").onclick=async()=>{
  if(!$("#k").value.trim())return out("Colle d'abord la clé.","bad");
  out("Écriture en cours…");
  let id=null;
  try{
    const c=await call(B+"/events",{method:"POST",headers:H(),body:JSON.stringify({category:"NOTE",start_date_local:day(60)+"T00:00:00",name:"TEST app (supprimé automatiquement)",type:"Run"})});
    if(c.s!==200)return out("Création : HTTP "+c.s+"\n"+c.t.slice(0,300),"bad");
    id=JSON.parse(c.t).id;
    const d=await call(B+"/events/"+id,{method:"DELETE",headers:H()});
    if(d.s!==200)return out("Note créée (id "+id+") mais suppression : HTTP "+d.s+". Supprime-la à la main dans Intervals (dans 60 jours).","bad");
    out("ÉCRITURE OK : note créée (id "+id+") puis supprimée.","ok");
  }catch(e){out("ÉCHEC : "+e.message+(id?"\nLa note "+id+" existe peut-être : supprime-la dans Intervals.":"")+"\nSi c'est « Load failed », le navigateur bloque l'écriture (CORS).","bad")}
};
</script>
</body>
</html>
