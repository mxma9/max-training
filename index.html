<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Max Training</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#090B0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Max">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0;padding-top:max(12px,env(safe-area-inset-top,0px))}
:root{--bg:#090B0E;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.075);--line:rgba(255,255,255,.1);--fg:#EEF1F4;--soft:#C9D0D7;--mute:#98A2AD;--lime:#C6F432;--limeink:#0A0C0F;--ok:#C6F432;--warn:#FFB020;--bad:#FF6A5C;--cyan:#35D6FF;--violet:#9B7BFF;--sand:#E8D9A8;--hero:linear-gradient(160deg,rgba(198,244,50,.17),rgba(198,244,50,.03) 55%,rgba(255,255,255,.04));--heroline:rgba(198,244,50,.4);--navbg:rgba(22,26,32,.88);--glow1:rgba(198,244,50,.14);--glow2:rgba(53,214,255,.12);--selbg:rgba(198,244,50,.13);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EDF0F3;--card:#fff;--card2:#E6EAEE;--line:#D6DCE2;--fg:#0E1116;--soft:#3A4450;--mute:#5B6672;--lime:#9BD100;--limeink:#0A0C0F;--ok:#4E7A00;--warn:#B36B00;--bad:#C93A2E;--cyan:#087E9F;--violet:#5E43C9;--sand:#7C6A33;--hero:linear-gradient(160deg,#E9F6B4,#F7FBE3 60%,#fff);--heroline:#B9D64A;--navbg:rgba(255,255,255,.92);--glow1:rgba(155,209,0,.16);--glow2:rgba(8,126,159,.1);--selbg:#E4F3A8;color-scheme:light}}
:root[data-theme="light"]{--bg:#EDF0F3;--card:#fff;--card2:#E6EAEE;--line:#D6DCE2;--fg:#0E1116;--soft:#3A4450;--mute:#5B6672;--lime:#9BD100;--limeink:#0A0C0F;--ok:#4E7A00;--warn:#B36B00;--bad:#C93A2E;--cyan:#087E9F;--violet:#5E43C9;--sand:#7C6A33;--hero:linear-gradient(160deg,#E9F6B4,#F7FBE3 60%,#fff);--heroline:#B9D64A;--navbg:rgba(255,255,255,.92);--glow1:rgba(155,209,0,.16);--glow2:rgba(8,126,159,.1);--selbg:#E4F3A8;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(380px 380px at 0% 0%,var(--glow1),transparent 66%),radial-gradient(380px 380px at 100% 45%,var(--glow2),transparent 66%)}
body{background:transparent;color:var(--fg);font:15px/1.45 Manrope,system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{margin:0;font-family:Sora,Manrope,sans-serif;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
h2{font-weight:700}
.num{font-family:Sora,Manrope,sans-serif;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;gap:8px}
.top .hi{color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.top h1{font-size:32px;line-height:1.05}
.pill{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:0 14px;min-height:44px;font:600 13px Manrope;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;margin-bottom:12px;min-width:0}
.card.lime{background:var(--hero);border-color:var(--heroline);color:var(--fg);border-radius:28px;padding:18px}
.lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.big{font-size:64px;line-height:.95}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.day{background:var(--card);border-radius:18px;padding:9px 0 8px;text-align:center;border:1px solid var(--line);cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.day small{display:block;color:var(--mute);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.day b{font:600 16px Sora;display:block;margin:3px 0 4px}
.day.sel{background:var(--selbg);border-color:var(--lime)}.day.sel small{color:var(--ok)}
.day.today b{text-decoration:underline;text-decoration-color:var(--lime);text-underline-offset:4px;text-decoration-thickness:2px}
.dots{display:flex;gap:3px;justify-content:center;height:5px}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.dot.run{background:var(--lime)}.dot.swim{background:var(--cyan)}.dot.gym{background:var(--violet)}.dot.mob{background:var(--sand)}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chip{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--card2);color:var(--fg)}
.chip.lime{background:var(--lime);color:var(--limeink)}
.chip.warn{background:var(--warn);color:#0a0a0a}
.light{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:middle}
.g{background:var(--ok)}.o{background:var(--warn)}.r{background:var(--bad)}
ul.ex{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
ul.ex li{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--card2);border-radius:16px;font-size:14px}
ul.ex li span.k{font:600 14px Sora;min-width:22px;color:var(--ok)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit}
input[type=range]{padding:0;accent-color:var(--lime)}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--lime);color:var(--limeink);border:0;border-radius:999px;padding:14px 18px;min-height:48px;font:700 15px Manrope;cursor:pointer;width:100%}
.btn.sec{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;min-height:44px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:10px 0;font:700 15px Manrope;cursor:pointer}
.seg button.on{background:var(--lime);color:var(--limeink);border-color:var(--lime)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--lime)}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
nav .in{pointer-events:auto;display:flex;gap:2px;background:var(--navbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;padding:6px;width:100%;max-width:560px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;color:var(--mute);padding:8px 0;border-radius:20px;font:600 11px Manrope;cursor:pointer;min-width:0}
nav button svg{width:18px;height:18px}
nav button.on{background:var(--selbg);color:var(--ok);font-weight:700}
.note{font-size:12.5px;color:var(--mute)}
.warn{color:var(--warn)}
.okc{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}
svg text{fill:var(--mute);font:10px Manrope}
.ph{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.ph:last-child{border:0}
.ph b{font-family:Sora;font-size:15px;font-weight:600}
.dayrow{cursor:pointer}
.done{color:var(--ok);font-size:13px;font-weight:600;margin-top:3px}
.nav2{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:4px 0 10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ring .rg{position:relative;width:74px;height:74px}
.ring .rg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 22px Sora}
.ring small{font-size:12px;font-weight:600;color:var(--soft)}
.reps{position:relative;height:84px;display:flex;align-items:flex-end;gap:10px;margin:12px 0 6px}
.reps .band{position:absolute;left:0;right:0;border-radius:7px;border:1px dashed var(--heroline);background:var(--selbg)}
.reps i{position:relative;flex:1;border-radius:10px}
.replab{display:flex;justify-content:space-between;font:600 12px Sora;color:var(--soft)}
details.mob summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 0 4px;min-height:44px}
details.mob summary::-webkit-details-marker{display:none}
details.mob ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
details.mob li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 12px;background:var(--card2);border-radius:16px}
details.mob li .k{font:600 13px Sora;color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--lime);color:var(--limeink);padding:10px 16px;border-radius:999px;font:700 14px Manrope;z-index:50}
button{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<script src="app.js"></script>
</body>
</html>
